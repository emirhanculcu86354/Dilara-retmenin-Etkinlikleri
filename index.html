<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dilara Öğretmenin Etkinlikleri</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito:wght@500;700;800&display=swap">
<style>
:root{
  --bg:#E9F6FF; --bg2:#D3EDFF; --card:#FFFFFF; --ink:#1F2A55; --muted:#59658F; --line:#1F2A55;
  --sun:#FFC933; --grass:#5DBB63; --coral:#FF6F61; --grape:#8A63D2; --sky:#4FB3F0;
  --on:#1F2A55; --sk1:#8FD3FF; --sk2:#E4F6FF;
  --head:"Baloo 2","Arial Rounded MT Bold","Trebuchet MS",system-ui,sans-serif;
  --body:"Nunito","Trebuchet MS",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#131A3B; --bg2:#1B2557; --card:#1F2A5C; --ink:#F1F4FF; --muted:#A9B4DD; --line:#080C22;
    --sk1:#1A2766; --sk2:#3A4C9F; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#131A3B; --bg2:#1B2557; --card:#1F2A5C; --ink:#F1F4FF; --muted:#A9B4DD; --line:#080C22;
  --sk1:#1A2766; --sk2:#3A4C9F; color-scheme:dark;
}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font:500 16px/1.5 var(--body);-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:25;background:var(--bg)}
body.lock{overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--grape);outline-offset:2px}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- Açılış ---------- */
#splash{position:fixed;inset:0;z-index:100;background:linear-gradient(var(--sk1),var(--sk2));display:grid;place-items:center;overflow:hidden;transition:opacity .5s ease;cursor:pointer}
#splash.out{opacity:0;pointer-events:none}
.sun{position:absolute;top:calc(env(safe-area-inset-top,0px) + 7vh);right:9vw;width:84px;height:84px;border-radius:50%;background:var(--sun);border:3px solid var(--line)}
.sun::before{content:"";position:absolute;inset:-22px;border-radius:50%;border:7px dotted var(--sun);animation:spin 26s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.cloud{position:absolute;left:-180px;width:96px;height:30px;background:#fff;border:3px solid #1F2A55;border-radius:30px;animation:drift 46s linear infinite}
.cloud::before,.cloud::after{content:"";position:absolute;background:#fff;border:3px solid #1F2A55;border-radius:50%;border-bottom-color:transparent}
.cloud::before{width:42px;height:42px;left:12px;top:-26px;border-right-color:transparent}
.cloud::after{width:52px;height:52px;left:38px;top:-34px;border-left-color:transparent}
.cloud.c1{top:12vh}
.cloud.c2{top:26vh;transform:scale(.7);animation-duration:62s;animation-delay:-24s}
.cloud.c3{top:40vh;transform:scale(.55);animation-duration:80s;animation-delay:-50s}
@keyframes drift{to{translate:calc(100vw + 360px) 0}}
.balloon{position:absolute;bottom:-90px;width:38px;height:48px;border-radius:50% 50% 48% 48%;background:var(--c);border:3px solid #1F2A55;animation:rise 18s linear infinite}
.balloon::after{content:"";position:absolute;left:50%;top:100%;width:2px;height:46px;background:#1F2A55}
@keyframes rise{to{transform:translateY(-125vh)}}
.scene{position:absolute;left:0;right:0;bottom:0;height:46vh;min-height:220px}
.scene svg{width:100%;height:100%;display:block}
.titlebox{position:relative;z-index:5;text-align:center;padding:0 24px;margin-top:-12vh}
.line{display:flex;justify-content:center;gap:4px;margin:7px 0;--b:min(60px,calc((100vw - 92px) / 12))}
.line.l1{--k:1.7}.line.l2{--k:1.2}.line.l3{--k:1}
.blk{width:calc(var(--b)*var(--k));height:calc(var(--b)*var(--k));font:800 calc(var(--b)*var(--k)*.62)/1 var(--head);color:#1F2A55;background:var(--c);border:2.5px solid #1F2A55;border-radius:calc(var(--b)*var(--k)*.22);box-shadow:3px 3px 0 #1F2A55;display:grid;place-items:center;transform:rotate(var(--r));animation:drop 1s cubic-bezier(.25,.8,.3,1) both;animation-delay:calc(var(--i)*65ms + 250ms)}
@keyframes drop{
  0%{transform:translateY(-110vh) rotate(calc(var(--r)*6));opacity:0}
  55%{transform:translateY(0) rotate(var(--r));opacity:1}
  72%{transform:translateY(-16px) rotate(var(--r))}
  88%{transform:translateY(0) rotate(var(--r))}
  100%{transform:translateY(0) rotate(var(--r))}
}
.sub{margin:16px 0 0;font:700 1.05rem var(--head);color:#1F2A55;animation:fadeup .6s ease both;animation-delay:2.9s}
#go{margin-top:16px;font:800 1.25rem var(--head);padding:10px 34px;background:var(--coral);color:#1F2A55;border:3px solid #1F2A55;border-radius:999px;box-shadow:4px 4px 0 #1F2A55;animation:fadeup .6s ease both;animation-delay:3.2s}
#go:active{transform:translate(3px,3px);box-shadow:1px 1px 0 #1F2A55}
@keyframes fadeup{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}

/* ---------- Üst çubuk ve gezinme ---------- */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);display:flex;align-items:center;gap:12px;padding:10px 16px;border-bottom:2.5px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto}
.logo{width:42px;height:42px;display:grid;place-items:center;font-size:24px;background:var(--sun);border:2.5px solid var(--line);border-radius:14px 14px 14px 4px;box-shadow:2px 2px 0 var(--line)}
.brand b{display:block;font:800 1.15rem/1.1 var(--head)}
.brand small{display:block;color:var(--muted);font-weight:700;font-size:.8rem;line-height:1.1}
.icon{width:44px;height:44px;border-radius:14px;border:2.5px solid var(--line);background:var(--card);box-shadow:2px 2px 0 var(--line);font:800 1.4rem/1 var(--head);display:grid;place-items:center;padding:0}
.icon:active{transform:translate(2px,2px);box-shadow:none}
#tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;display:grid;grid-template-columns:repeat(5,1fr);gap:2px;background:var(--card);border-top:2.5px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px))}
#tabs button{display:flex;flex-direction:column;align-items:center;gap:0;padding:5px 1px;border:2px solid transparent;border-radius:14px;background:none;font:700 .68rem/1.15 var(--body);text-align:center}
#tabs button span.e{font-size:1.35rem;line-height:1.2}
#tabs button.on{background:var(--sun);border-color:var(--line);color:#1F2A55}
main{max-width:1040px;margin:0 auto;padding:18px 16px 120px}

/* ---------- Ortak parçalar ---------- */
.card{background:var(--card);border:2.5px solid var(--line);border-radius:22px;box-shadow:4px 4px 0 var(--line)}
.datebar{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.datebar .title{flex:1;text-align:center;font:800 1.2rem/1.2 var(--head)}
.datebar .title small{display:block;color:var(--muted);font:700 .85rem var(--body)}
.center{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin:0 0 14px}
.btn{font:800 1rem/1.2 var(--head);padding:10px 16px;border:2.5px solid var(--line);border-radius:16px;background:#fff;color:#1F2A55;box-shadow:3px 3px 0 var(--line);display:inline-flex;align-items:center;gap:8px}
.btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--line)}
.btn.primary{background:var(--coral)}
.btn.ok{background:var(--grass)}
.btn.warn{background:var(--sun)}
.chip{display:inline-flex;align-items:center;gap:5px;padding:2px 11px;border:2px solid var(--line);border-radius:999px;background:var(--cat,#fff);color:#1F2A55;font-weight:800;font-size:.84rem;line-height:1.5}
.chip.w{background:#fff}
.mini{color:var(--muted);font-weight:700;font-size:.85rem}
.progress{margin:18px 0 0;padding:12px 16px}
.progress p{margin:0 0 6px;font-weight:800}
.bar{height:16px;border:2.5px solid var(--line);border-radius:999px;background:var(--bg2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--grass)}

/* ---------- Etkinlik kartı ---------- */
.hero{border-radius:30px;box-shadow:6px 6px 0 var(--line);overflow:hidden}
.hero-top{background:var(--cat);padding:18px;display:flex;gap:16px;align-items:center;border-bottom:2.5px solid var(--line);color:#1F2A55}
.badge{flex:none;width:86px;height:86px;border-radius:50%;background:#fff;border:2.5px solid var(--line);display:grid;place-items:center;font-size:46px;line-height:1}
.hero-top h2{margin:0 0 6px;font:800 clamp(1.5rem,5.2vw,2.3rem)/1.1 var(--head)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.when{margin:0 0 8px;font-weight:800;color:#1F2A55;opacity:.8;font-size:.9rem}
.hero-body{padding:18px;display:grid;gap:18px}
.hero-body h3{margin:0 0 6px;font:800 1.15rem/1.2 var(--head)}
.hero-body p{margin:0}
.mats{display:flex;flex-wrap:wrap;gap:6px}
.mats span{background:var(--bg2);border:2px solid var(--line);border-radius:12px;padding:2px 10px;font-weight:700;font-size:.92rem}
ol.steps{list-style:none;counter-reset:s;margin:0;padding:0}
ol.steps li{counter-increment:s;position:relative;padding-left:44px;margin:0 0 10px;min-height:32px}
ol.steps li::before{content:counter(s);position:absolute;left:0;top:-1px;width:32px;height:32px;border-radius:50%;background:var(--sun);border:2px solid var(--line);color:#1F2A55;font:800 1rem/1 var(--head);display:grid;place-items:center}
.note{background:#FFF3C4;color:#5A4300;border:2px dashed #C99700;border-radius:14px;padding:9px 12px;font-weight:700}
ul.q{margin:0;padding-left:20px}
.actions{display:flex;flex-wrap:wrap;gap:10px;padding:0 18px 18px}
.state{text-align:center;padding:34px 20px}
.state .big{font-size:64px;line-height:1.1}
.state h2{margin:8px 0 6px;font:800 1.6rem var(--head)}
.state p{margin:0 0 14px;color:var(--muted);font-weight:700}
.state .center{margin:14px 0 0}

/* ---------- Hafta ---------- */
.rows{display:grid;gap:10px}
.row{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:10px 12px;background:var(--card);border:2.5px solid var(--line);border-radius:20px;box-shadow:3px 3px 0 var(--line)}
.row:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--line)}
.row.today{background:color-mix(in srgb,var(--sun) 35%,var(--card))}
.dt{flex:none;width:58px;height:58px;border-radius:16px;border:2px solid var(--line);background:var(--bg2);display:grid;place-content:center;text-align:center;line-height:1.1}
.dt small{font-weight:800;color:var(--muted)}
.dt b{font:800 1.4rem/1 var(--head)}
.row .em{flex:none;font-size:2rem}
.rt{flex:1;display:flex;flex-direction:column;align-items:flex-start;gap:2px;min-width:0}
.rt b{font:800 1.08rem/1.2 var(--head)}
.tick{flex:none;width:30px;height:30px;border-radius:50%;background:var(--grass);border:2px solid var(--line);display:grid;place-items:center;font-weight:800;color:#1F2A55}

/* ---------- Ay ---------- */
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}
.dow{text-align:center;font-weight:800;color:var(--muted);font-size:.85rem}
.cell{min-height:78px;padding:5px;border:2px solid var(--line);border-radius:13px;background:color-mix(in srgb,var(--cat,var(--card)) 45%,var(--card));text-align:left;display:flex;flex-direction:column;gap:1px;overflow:hidden;position:relative;color:var(--ink)}
.cell b{font:800 .85rem/1.1 var(--head)}
.cell .em{font-size:1.45rem;line-height:1.15}
.cell .nm{font-size:.7rem;line-height:1.15;font-weight:800;display:-webkit-box;-webkit-line-clamp:2;line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.cell.we{background:var(--bg2);opacity:.55;border-style:dashed}
.cell.bf{background:var(--card);opacity:.6}
.cell.ho{background:repeating-linear-gradient(135deg,var(--card) 0 8px,var(--bg2) 8px 16px)}
.cell.today{outline:4px solid var(--sun);outline-offset:1px}
.cell .tick{position:absolute;right:3px;top:3px;width:18px;height:18px;font-size:.7rem}
.blank{min-height:1px}

/* ---------- Liste ---------- */
.search{width:100%;padding:12px 16px;border:2.5px solid var(--line);border-radius:18px;background:var(--card);color:var(--ink);font:700 1rem var(--body);margin-bottom:10px}
.filters{display:flex;gap:6px;overflow-x:auto;padding:2px 2px 10px;margin:0 -2px}
.filters button{flex:none;border:2px solid var(--line);border-radius:999px;background:var(--card);padding:3px 12px;font-weight:800;font-size:.88rem;color:var(--ink)}
.filters button.on{background:var(--cat,var(--sun));color:#1F2A55}
.count{margin:2px 0 10px;color:var(--muted);font-weight:700}
.grid{display:grid;gap:10px;grid-template-columns:1fr}
.item{display:flex;align-items:center;gap:12px;text-align:left;width:100%;padding:10px 12px;background:var(--card);border:2.5px solid var(--line);border-left:12px solid var(--cat);border-radius:18px;box-shadow:3px 3px 0 var(--line)}
.item:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--line)}
.item .em{font-size:1.9rem;flex:none}
.item .rt b span{color:var(--muted);font-weight:700;margin-right:4px}
.empty{padding:28px;text-align:center;color:var(--muted);font-weight:700}

/* ---------- Pencere ---------- */
.modal{position:fixed;inset:0;z-index:60;background:rgba(8,12,34,.55);display:flex;align-items:flex-end;justify-content:center}
.sheet{position:relative;width:min(760px,100%);max-height:92vh;overflow:auto;background:var(--bg);border:2.5px solid var(--line);border-bottom:0;border-radius:28px 28px 0 0;padding:14px 14px calc(20px + env(safe-area-inset-bottom,0px));animation:up .25s ease}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
.sheet .x{position:sticky;top:0;margin:0 0 8px auto;display:grid;z-index:2}
.sheet h2.st{margin:0 0 10px;font:800 1.4rem var(--head)}
.field{display:grid;gap:6px;margin:0 0 16px}
.field label{font-weight:800}
.field input[type=date]{padding:10px 12px;border:2.5px solid var(--line);border-radius:14px;background:var(--card);color:var(--ink);font:700 1rem var(--body);max-width:260px}
.field p{margin:0;color:var(--muted);font-weight:700;font-size:.92rem}
.toast{position:fixed;left:50%;bottom:calc(86px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);z-index:80;background:#1F2A55;color:#fff;border:2px solid #fff;border-radius:14px;padding:9px 16px;font-weight:800;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;max-width:calc(100vw - 32px);text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}

@media (min-width:860px){
  #tabs{position:static;border:0;background:none;padding:0;display:flex;gap:6px}
  #tabs button{flex-direction:row;gap:6px;padding:7px 14px;font:800 .95rem var(--head);white-space:nowrap}
  #tabs button span.e{font-size:1.1rem}
  .top{padding:12px 28px}
  main{padding:26px 28px 48px}
  .hero-body{grid-template-columns:1fr 1.25fr;gap:26px;padding:24px}
  .actions{padding:0 24px 24px}
  .hero-top{padding:24px}
  .badge{width:104px;height:104px;font-size:56px}
  .cell{min-height:108px;padding:8px}
  .cell .nm{font-size:.82rem}
  .cell .em{font-size:1.8rem}
  .grid{grid-template-columns:repeat(2,1fr)}
  .modal{align-items:center}
  .sheet{border-bottom:2.5px solid var(--line);border-radius:28px;padding-bottom:20px}
  .toast{bottom:24px}
}
@media (min-width:1100px){.grid{grid-template-columns:repeat(3,1fr)}}
@media (max-width:520px){
  .cell .nm{display:none}
  .cell{min-height:64px;align-items:flex-start}
  .cell .em{font-size:1.5rem}
  .cal{gap:4px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}

/* ---------- Yazdırma sayfası ---------- */
#printSheet{display:none}
@page{size:A4;margin:12mm}
@media print{
  html,body{background:#fff!important;padding:0!important}
  body::before{display:none!important}
  body>*:not(#printSheet){display:none!important}
  #printSheet{display:block!important;color:#1F2A55;font-family:"Nunito",Arial,sans-serif;font-size:10.5pt;line-height:1.4;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .ps-top{display:flex;justify-content:space-between;align-items:center;border-bottom:3px solid #1F2A55;padding-bottom:6px;margin-bottom:12px;font-weight:800}
  .ps-brand{font-family:"Baloo 2","Arial Rounded MT Bold",Arial,sans-serif;font-size:14pt}
  .ps-hero{display:flex;gap:14px;align-items:center;background:var(--cat);border:3px solid #1F2A55;border-radius:18px;padding:12px 16px;margin-bottom:12px}
  .ps-emoji{flex:none;width:30mm;height:30mm;border-radius:50%;background:#fff;border:3px solid #1F2A55;display:grid;place-items:center;font-size:54pt;line-height:1}
  .ps-hero h1{margin:0 0 6px;font-family:"Baloo 2","Arial Rounded MT Bold",Arial,sans-serif;font-size:24pt;line-height:1.1}
  .ps-chips{display:flex;flex-wrap:wrap;gap:6px}
  .ps-chips span{background:#fff;border:2px solid #1F2A55;border-radius:999px;padding:1px 10px;font-weight:800;font-size:10pt}
  .ps-cols{display:grid;grid-template-columns:1fr 1.25fr;gap:14px}
  #printSheet h2{margin:10px 0 4px;font-family:"Baloo 2","Arial Rounded MT Bold",Arial,sans-serif;font-size:13pt;border-bottom:2px dotted #1F2A55}
  #printSheet h2:first-child{margin-top:0}
  #printSheet p{margin:0}
  .ps-check{list-style:none;margin:0;padding:0}
  .ps-check li{padding-left:22px;position:relative;margin:2px 0}
  .ps-check li::before{content:"";position:absolute;left:0;top:3px;width:12px;height:12px;border:2px solid #1F2A55;border-radius:3px}
  .ps-steps{margin:0;padding-left:22px}
  .ps-steps li{margin:0 0 5px;padding-left:2px}
  .ps-q{margin:0;padding-left:18px}
  .ps-boxes{display:grid;grid-template-columns:1.4fr 1fr;gap:12px;margin-top:12px}
  .ps-draw,.ps-notes{border:2.5px dashed #1F2A55;border-radius:14px;height:52mm;padding:6px 10px;font-weight:800}
  .ps-notes i{display:block;border-bottom:1.5px solid #1F2A55;height:9mm}
  .ps-note-caution{background:#FFF3C4;border:2px dashed #C99700;border-radius:8px;padding:4px 8px;font-weight:700}
}

/* ---------- Formlar, sınıf, uyarılar ---------- */
.btnrow{display:flex;flex-wrap:wrap;gap:10px;margin:16px 0}
.inp{width:100%;padding:10px 12px;border:2.5px solid var(--line);border-radius:14px;background:var(--card);color:var(--ink);font:700 1rem var(--body)}
.ta{min-height:86px;resize:vertical;font-weight:600}
.form{display:grid;gap:12px}
.fld{display:grid;gap:4px}
.fld>label,.field>label,fieldset.al legend{font-weight:800}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
fieldset.al{border:2.5px solid var(--line);border-radius:14px;padding:8px 12px 10px;margin:0}
.ck{display:flex;align-items:center;gap:8px;padding:3px 0;font-weight:700}
.ck input{width:20px;height:20px;flex:none;accent-color:var(--grass)}
.alset{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:0 12px}
.alert{background:#FFE3E0;color:#6B1209;border:2px solid #C0392B;border-radius:14px;padding:9px 12px;font-weight:800}
.chip.red{background:#FF9AA2}
.stu{padding:14px;display:grid;gap:8px;align-content:start}
.stu h3{margin:0;font:800 1.2rem/1.2 var(--head)}
.stu a{color:inherit;font-weight:800}
.mlist{padding:14px 16px;margin-top:16px}
.mlist h3{margin:0 0 4px;font:800 1.15rem var(--head)}
.mlist ul{list-style:none;margin:8px 0 0;padding:0;columns:2 230px;column-gap:18px}
.mlist li{break-inside:avoid}
.mlist small{color:var(--muted);font-weight:700}
.mlist input:checked+span{text-decoration:line-through;opacity:.6}
.item .btn{margin-left:auto;flex:none;padding:8px 12px}
@media (max-width:520px){.two{grid-template-columns:1fr}}
@media print{

function ageText(b){
  if(!b||!DATE_RE.test(b))return"";
  const d=parse(b),n=new Date();let y=n.getFullYear()-d.getFullYear(),m=n.getMonth()-d.getMonth();
  if(n.getDate()<d.getDate())m--;
  if(m<0){y--;m+=12}
  if(y<0)return"";
  return y+" yaş"+(m?" "+m+" ay":"");
}

function loadFrom(j){
  const Q={start:"2026-10-26",holidays:[],done:[],students:[],custom:[],edits:{},swap:{},got:{},cls:"",sid:1};
  if(!j||typeof j!=="object")return Q;
  if(typeof j.start==="string"&&DATE_RE.test(j.start))Q.start=j.start;
  if(Array.isArray(j.holidays))Q.holidays=j.holidays.filter(x=>typeof x==="string"&&DATE_RE.test(x));
  if(Array.isArray(j.done))Q.done=j.done.filter(x=>typeof x==="string"&&DATE_RE.test(x));
  if(Array.isArray(j.students))Q.students=j.students.filter(s=>s&&typeof s.n==="string").map(sanStudent);
  if(Array.isArray(j.custom))Q.custom=j.custom.filter(c=>c&&Number(c.id)>100).map(sanitizeAct);
  if(j.edits&&typeof j.edits==="object")for(const k in j.edits){if(BASE[k])Q.edits[k]=sanitizeAct(Object.assign({},j.edits[k],{id:Number(k)}))}
  if(j.swap&&typeof j.swap==="object")for(const k in j.swap){const v=Number(j.swap[k]);if(/^\d+$/.test(k)&&Number.isFinite(v))Q.swap[k]=v}
  if(j.got&&typeof j.got==="object")for(const k in j.got){if(j.got[k]===true)Q.got[k]=true}
  if(typeof j.cls==="string")Q.cls=j.cls.slice(0,60);
  let mx=1;Q.students.forEach((s,i)=>{if(!s.id)s.id=i+1;mx=Math.max(mx,s.id+1)});
  Q.sid=Math.max(Number(j.sid)||1,mx);
  return Q;
}

function getAct(id){
  const c=P.custom.find(x=>x.id===id);if(c)return c;
  const b=BASE[id];if(!b)return null;
  const e=P.edits[id];
  return e?Object.assign({},b,e,{id:b.id}):b;
}
const allIds=()=>ORDER.concat(P.custom.map(c=>c.id));

let idxMap=new Map(),dates=[];
function rebuild(){
  idxMap=new Map();dates=[];
  const hol=new Set(P.holidays);let d=parse(P.start),n=0;
  for(let i=0;i<3000;i++){
    const s=iso(d);
    if(dow(d)<5&&!hol.has(s)){idxMap.set(s,n);dates[n]=s;n++}
    d=addDays(d,1);
  }
}
function actIdAt(i){
  const s=P.swap[i];
  if(s!==undefined&&getAct(s))return s;
  return allIds()[i%total()];
}
function info(s){
  const d=parse(s);
  if(dow(d)>=5)return{k:"weekend"};
  if(P.holidays.includes(s))return{k:"holiday"};
  if(d<parse(P.start))return{k:"before"};
  const i=idxMap.get(s);
  if(i===undefined)return{k:"far"};
  const N=total(),p=i%N,id=actIdAt(i);
  return{k:"day",act:getAct(id),idx:i,no:p+1,round:Math.floor(i/N)+1,week:Math.floor(p/5)+1,swapped:id!==allIds()[p]};
}
function nextSchool(s){
  for(let i=1;i<500;i++){const t=iso(addDays(parse(s),i));if(info(t).k==="day")return t}
  return null;
}

  const N=total();
  for(let k=0;k<N;k++){if(actIdAt(k)===id)return dates[k]}
  return null;
}
function swapAct(date,newId){
  const r=info(date);if(r.k!=="day")return null;
  const N=total(),ids=allIds(),i=r.idx,cur=actIdAt(i),round=Math.floor(i/N);
  let i2=-1;
  for(let k=round*N;k<round*N+N;k++){if(k!==i&&actIdAt(k)===newId){i2=k;break}}
  P.swap[i]=newId;
  if(i2>=0)P.swap[i2]=cur;
  [i,i2].forEach(k=>{if(k>=0&&P.swap[k]===ids[k%N])delete P.swap[k]});
  return i2>=0?dates[i2]:null;
}

/* ---------- Alerji ---------- */
const alList=s=>s.al.map(k=>ALN[k]).concat(s.ao?[s.ao]:[]).join(", ");
function hits(a){
  const out=[];
  P.students.forEach(st=>{
    const why=[];
    (a.al||[]).forEach(k=>{if(st.al.indexOf(k)>=0)why.push(ALN[k])});
    if(st.ao){
      const hay=(a.n+" "+a.mat+" "+a.how).toLocaleLowerCase("tr-TR");
      st.ao.split(/[,;]/).map(x=>x.trim().toLocaleLowerCase("tr-TR")).filter(x=>x.length>=3).forEach(x=>{if(hay.indexOf(x)>=0)why.push(x)});
    }
    if(why.length)out.push({name:st.n,why:why.filter((x,i)=>why.indexOf(x)===i)});
  });
  return out;
}

/* ---------- Haftalık malzeme ---------- */
function weekMats(mon){
  const map=new Map();
  for(let i=0;i<5;i++){
    const r=info(iso(addDays(mon,i)));
    if(r.k!=="day")continue;
    mats(r.act).forEach(m=>{
      if(m==="Malzeme gerekmez")return;
      const key=m.toLocaleLowerCase("tr-TR");
      if(!map.has(key))map.set(key,{key:key,name:m,days:[]});
      const e=map.get(key);if(e.days.indexOf(DS[i])<0)e.days.push(DS[i]);
    });
  }
  return Array.from(map.values()).sort((a,b)=>a.name.localeCompare(b.name,"tr"));
}

function bar(prev,title,next,sub,resetA,resetLabel){
  return '<div class="datebar"><button class="icon" type="button" data-a="'+prev+'" aria-label="Önceki">‹</button><div class="title">'+esc(title)+(sub?"<small>"+esc(sub)+"</small>":"")+'</div><button class="icon" type="button" data-a="'+next+'" aria-label="Sonraki">›</button></div>'
   +(resetA?'<div class="center"><button class="btn" type="button" data-a="'+resetA+'">'+resetLabel+"</button></div>":"");
}
function progress(){

}
function viewToday(){

function weekRange(mon){
  const fri=addDays(mon,4);
  return mon.getMonth()===fri.getMonth()?mon.getDate()+" – "+fri.getDate()+" "+MONTHS[fri.getMonth()]+" "+fri.getFullYear():mon.getDate()+" "+MONTHS[mon.getMonth()]+" – "+fri.getDate()+" "+MONTHS[fri.getMonth()]+" "+fri.getFullYear();
}

    }

  }else h+='<p class="mini">Bu hafta için malzeme listesi yok.</p>';

  return h;

function viewMonth(){
  const y=S.mon.y,m=S.mon.m,t=todayISO(),now=new Date();
  const isThis=y===now.getFullYear()&&m===now.getMonth();
  let h=bar("prevMonth",MONTHS[m]+" "+y,"nextMonth","",isThis?"":"thisMonth","Bu ay");
  h+='<div class="cal">'+DS.map(x=>'<div class="dow">'+x+"</div>").join("");
  const first=new Date(y,m,1,12),n=new Date(y,m+1,0,12).getDate();
  for(let i=0;i<dow(first);i++)h+='<div class="blank"></div>';
  for(let day=1;day<=n;day++){
    const d=new Date(y,m,day,12),s=iso(d),r=info(s),isT=s===t;
    if(r.k==="weekend"){h+='<div class="cell we'+(isT?" today":"")+'"><b>'+day+"</b></div>";continue}
    let cls="cell",inner="<b>"+day+"</b>",st="";
    if(r.k==="day"){const c=CI[r.act.cat];st=' style="--cat:'+c.c+'"';inner+='<span class="em" aria-hidden="true">'+esc(r.act.e)+'</span><span class="nm">'+esc(r.act.n)+"</span>"}
    else if(r.k==="holiday"){cls+=" ho";inner+='<span class="nm">Tatil</span>'}
    else cls+=" bf";
    if(isT)cls+=" today";
    if(P.done.indexOf(s)>=0)inner+='<span class="tick" aria-label="Yapıldı">✓</span>';
    h+='<button type="button" class="'+cls+'"'+st+' data-a="openDay" data-date="'+s+'" aria-label="'+esc(fmtShort(s)+(r.k==="day"?": "+r.act.n:""))+'">'+inner+"</button>";
  }
  return h+"</div>";
}

   +fld("Diğer alerji (virgülle ayırın)",'<input class="inp" id="s_ao" type="text" maxlength="160" value="'+esc(s.ao)+'" placeholder="örn. çilek, balık">',"s_ao")
   +fld("Not (ilaç, özel durum, servis…)",'<textarea class="inp ta" id="s_note" maxlength="300">'+esc(s.note)+"</textarea>","s_note")
   +'<div class="btnrow" style="margin:4px 0 0"><button class="btn ok" type="button" data-a="saveStu" data-id="'+(id||0)+'">Kaydet</button><button class="btn" type="button" data-a="close">Vazgeç</button>'+(id?'<button class="btn" type="button" data-a="delStu" data-id="'+id+'">Öğrenciyi sil</button>':"")+"</div></div>";
}
function swapHTML(date,mode){
  const r=info(date);if(r.k!=="day")return stateCard(r,date);
  const cur=r.act;
  const cands=allActs().filter(a=>a.id!==cur.id&&(mode==="bahce"?/Bahçe/.test(a.place):!/Bahçe/.test(a.place)));
  const score=a=>(a.cat===cur.cat?0:2)+(a.energy===cur.energy?0:1);
  cands.sort((x,y)=>score(x)-score(y)||x.id-y.id);
  let h='<h2 class="st">Etkinliği değiştir</h2><p class="mini" style="margin:0 0 10px">'+esc(fmtShort(date))+": "+esc(cur.e)+" "+esc(cur.n)+" ("+esc(cur.place)+'). Seçtiğiniz etkinlik bu güne gelir, bu etkinlik de onun gününe geçer; böylece hiçbiri tekrar etmez.</p>';
  h+='<div class="btnrow" style="margin-top:0"><button class="btn '+(mode==="ic"?"warn":"")+'" type="button" data-a="swapMode" data-date="'+date+'" data-mode="ic">🌧️ Hava kötü: içeride yap</button><button class="btn '+(mode==="bahce"?"warn":"")+'" type="button" data-a="swapMode" data-date="'+date+'" data-mode="bahce">☀️ Hava güzel: bahçede yap</button></div>';
  h+='<div class="grid" style="grid-template-columns:1fr">'+cands.slice(0,8).map(a=>{
    const nh=hits(a).length;
    return '<div class="item" style="--cat:'+CI[a.cat].c+'"><span class="em" aria-hidden="true">'+esc(a.e)+'</span><span class="rt"><b>'+esc(a.n)+'</b><span class="mini">'+esc(a.cat)+" · "+a.dur+" dk · "+esc(a.place)+"</span>"+(nh?'<span class="chip red">⚠️ alerji: '+nh+"</span>":"")+'</span><button class="btn" type="button" data-a="doSwap" data-date="'+date+'" data-id="'+a.id+'">Değiştir</button></div>';
  }).join("")+"</div>";
  if(!cands.length)h+='<div class="empty">Bu seçenekte uygun etkinlik yok.</div>';
  if(r.swapped){const bid=allIds()[r.idx%total()];h+='<div class="btnrow"><button class="btn" type="button" data-a="doSwap" data-date="'+date+'" data-id="'+bid+'">↩︎ Eski haline getir</button></div>'}
  return h;
}
function settingsHTML(){
  return '<h2 class="st">Ayarlar</h2>'
   +'<div class="field"><label for="startInput">Program başlangıç tarihi</label><input class="inp" type="date" id="startInput" value="'+P.start+'" style="max-width:260px"><p>Program bu tarihten itibaren her iş gününe bir etkinlik koyar.</p><div><button class="btn ok" type="button" data-a="saveStart">Kaydet</button></div></div>'
   +'<div class="field"><label>Tatil günleri</label><p>'+P.holidays.length+" gün tatil işaretli.</p><div><button class=\"btn\" type=\"button\" data-a=\"clearHolidays\">Tatilleri temizle</button></div></div>"
   +'<div class="field"><label>İlerleme</label><p>'+P.done.length+" etkinlik tamamlandı olarak işaretli.</p><div><button class=\"btn\" type=\"button\" data-a=\"resetDone\">İlerlemeyi sıfırla</button></div></div>"
   +'<div class="field"><label for="backupBox">Yedek (telefon ve bilgisayar arasında taşımak için)</label><p>Yedek; öğrenci listesini, düzenlediğiniz etkinlikleri, tatilleri ve ilerlemeyi içerir. Öğrenci bilgisi içerdiği için güvenli saklayın.</p><textarea class="inp ta" id="backupBox" placeholder="Başka cihazdan kopyaladığınız yedeği buraya yapıştırın"></textarea><div class="btnrow" style="margin:6px 0 0"><button class="btn" type="button" data-a="copyBackup">📋 Yedeği kopyala</button><button class="btn" type="button" data-a="importBackup">Yedeği yükle</button></div></div>'
   +'<div class="field"><p>Bu ayarlar yalnızca bu cihazda saklanır.</p></div>';
}

/* ---------- Pencere ---------- */
function modalHTML(){
  if(!modalCtx)return"";
  const m=modalCtx;
  if(m.type==="day")return dayHTML(m.date);
  if(m.type==="act"){const a=getAct(m.id);return a?actCard(a,{first:firstDate(a.id)}):""}
  if(m.type==="settings")return settingsHTML();
  if(m.type==="edit")return actFormHTML(m.id);
  if(m.type==="stu")return studentFormHTML(m.id);
  if(m.type==="swap")return swapHTML(m.date,m.mode);
  return"";
}
function openModal(ctx){modalCtx=ctx;$("#sheetBody").innerHTML=modalHTML();$("#modal").hidden=false;document.body.classList.add("lock");$(".sheet").scrollTop=0}
function refreshModal(){if(modalCtx&&!$("#modal").hidden)$("#sheetBody").innerHTML=modalHTML()}
function closeModal(){$("#modal").hidden=true;document.body.classList.remove("lock");modalCtx=null}
let tt=null;
function toast(msg){const t=$("#toast");t.textContent=msg;t.classList.add("show");clearTimeout(tt);tt=setTimeout(()=>t.classList.remove("show"),2800)}
function refreshAll(){render();refreshModal()}

/* ---------- Yazdırma ---------- */
function psHead(title){
  return '<div class="ps-top"><div class="ps-brand">🌈 Dilara Öğretmenin Etkinlikleri</div><div>'+esc(P.cls||"")+'</div></div><h1 class="ps-title">'+esc(title)+"</h1>";
}
function printHTML(a,date){
  const c=CI[a.cat],hs=hits(a);
  return '<div style="--cat:'+c.c+'"><div class="ps-top"><div class="ps-brand">🌈 Dilara Öğretmenin Etkinlikleri</div><div>'+(date?esc(fmtLong(parse(date))):esc(P.cls||""))+"</div></div>"
   +'<div class="ps-hero"><div class="ps-emoji">'+esc(a.e)+"</div><div><h1>"+esc(a.n)+'</h1><div class="ps-chips"><span>'+c.e+" "+esc(a.cat)+"</span><span>⏱️ "+a.dur+" dk</span><span>📍 "+esc(a.place)+"</span><span>⚡ "+esc(a.energy)+"</span></div></div></div>"
   +(hs.length?'<p class="ps-warn" style="margin-bottom:10px">⚠️ Alerji uyarısı: '+esc(hs.map(hitText).join("; "))+"</p>":"")
   +'<div class="ps-cols"><div><h2>Malzemeler</h2><ul class="ps-check">'+mats(a).map(m=>"<li>"+esc(m)+"</li>").join("")+"</ul>"
   +"<h2>Kazanım</h2><p>"+esc(a.skill)+'</p><h2>Dikkat</h2><p class="ps-note-caution">'+esc(a.caution)+"</p></div>"
   +'<div><h2>Nasıl yapılır</h2><ol class="ps-steps">'+steps(a).map(s=>"<li>"+esc(s)+"</li>").join("")+"</ol></div></div>"
   +'<h2 style="margin-top:12px">Çocuklara soralım</h2><ul class="ps-q">'+QUESTIONS[a.cat].map(q=>"<li>"+esc(q)+"</li>").join("")+"</ul>"
   +'<div class="ps-boxes"><div class="ps-draw">Çocuğun çalışması</div><div class="ps-notes">Öğretmen notu<i></i><i></i><i></i><i></i></div></div></div>';
}
function printWeekHTML(mon){
  let rows="",warns=[];
  for(let i=0;i<5;i++){
    const d=addDays(mon,i),s=iso(d),r=info(s);
    const head="<b>"+DAYS[i]+"</b><br>"+d.getDate()+" "+MONTHS[d.getMonth()];
    if(r.k==="day"){
      const hs=hits(r.act);
      if(hs.length)warns.push(DAYS[i]+": "+hs.map(hitText).join("; "));
      rows+="<tr><td>"+head+"</td><td><b>"+esc(r.act.e)+" "+esc(r.act.n)+"</b><br><small>"+esc(r.act.cat)+" · "+r.act.dur+" dk · "+esc(r.act.place)+"</small></td><td>"+esc(mats(r.act).join(", "))+"</td><td>"+(hs.length?'<span class="ps-warnt">⚠️ '+esc(hs.map(hitText).join("; "))+"</span>":"")+"</td></tr>";
    }else{
      rows+="<tr><td>"+head+"</td><td colspan=\"3\">"+(r.k==="holiday"?"Tatil günü":"Program yok")+"</td></tr>";
    }
  }
  const items=weekMats(mon);
  return psHead("Haftalık plan: "+weekRange(mon))
   +'<table class="ps-table"><thead><tr><th style="width:24mm">Gün</th><th>Etkinlik</th><th style="width:48mm">Malzemeler</th><th style="width:40mm">Alerji / Not</th></tr></thead><tbody>'+rows+"</tbody></table>"
   +'<h2 style="margin-top:12px">Haftanın malzeme listesi</h2>'
   +(items.length?'<ul class="ps-check ps-two">'+items.map(m=>"<li>"+esc(m.name)+" <small>("+m.days.join(", ")+")</small></li>").join("")+"</ul>":"<p>Bu hafta için malzeme yok.</p>")
   +'<div class="ps-boxes" style="grid-template-columns:1fr"><div class="ps-notes" style="height:34mm">Haftalık not<i></i><i></i><i></i></div></div>';
}
function printMatsHTML(mon){
  const items=weekMats(mon);
  return psHead("Malzeme listesi: "+weekRange(mon))
   +(items.length?'<ul class="ps-check ps-big">'+items.map(m=>"<li>"+esc(m.name)+" <small>("+m.days.join(", ")+")</small></li>").join("")+"</ul>":"<p>Bu hafta için malzeme yok.</p>");
}
function printClassHTML(){
  const rows=P.students.map((s,i)=>"<tr><td>"+(i+1)+"</td><td><b>"+esc(s.n)+"</b></td><td>"+(s.b?esc(fmtD(s.b))+"<br><small>"+esc(ageText(s.b))+"</small>":"")+"</td><td>"+esc(s.v)+(s.t?"<br>"+esc(s.t):"")+"</td><td>"+esc(alList(s))+"</td><td>"+esc(s.note)+"</td></tr>").join("");
  return psHead("Sınıf listesi")
   +"<p>"+P.students.length+" öğrenci · Yazdırma tarihi: "+esc(fmtD(todayISO()))+"</p>"
   +'<table class="ps-table"><thead><tr><th style="width:9mm">No</th><th>Ad soyad</th><th style="width:28mm">Doğum tarihi</th><th style="width:40mm">Veli / telefon</th><th style="width:38mm">Alerji</th><th>Not</th></tr></thead><tbody>'+(rows||'<tr><td colspan="6">Henüz öğrenci eklenmedi.</td></tr>')+"</tbody></table>";
}
function printAllergyHTML(){
  const L=P.students.filter(s=>s.al.length||s.ao);
  return psHead("Alerji listesi")
   +"<p>Yazdırma tarihi: "+esc(fmtD(todayISO()))+". Gıda ve boya içeren etkinliklerde, yemek ve ikram sırasında bu listeye bakın.</p>"
   +(L.length?'<ul class="ps-al">'+L.map(s=>"<li><b>"+esc(s.n)+"</b>"+(s.b?" <small>("+esc(ageText(s.b))+")</small>":"")+" — "+esc(alList(s))+(s.note?"<br><small>"+esc(s.note)+"</small>":"")+(s.v||s.t?"<br><small>Veli: "+esc(s.v)+" "+esc(s.t)+"</small>":"")+"</li>").join("")+"</ul>":"<p>Kayıtlı alerji bilgisi yok.</p>");
}
function printHtml(html){
  $("#printSheet").innerHTML=html;
  setTimeout(()=>{try{window.print()}catch(e){toast("Yazdırma bu pencerede açılamadı. Sayfayı yeni sekmede açın.")}},60);
}
function plainText(a,date){
  const hs=hits(a);
  const L=[a.n];
  if(date)L.push(fmtLong(parse(date)));
  L.push(a.cat+" · "+a.dur+" dk · "+a.place+" · "+a.energy,"");
  if(hs.length)L.push("ALERJİ UYARISI: "+hs.map(hitText).join("; "),"");
  L.push("Malzemeler: "+mats(a).join(", "),"","Nasıl yapılır:");
  steps(a).forEach((s,i)=>L.push((i+1)+". "+s));
  L.push("","Kazanım: "+a.skill,"Dikkat: "+a.caution,"","Çocuklara soralım:");
  QUESTIONS[a.cat].forEach(q=>L.push("- "+q));
  return L.join("\n");
}
function copyText(txt,okMsg){
  const ok=okMsg||"Metin kopyalandı";
  const fallback=()=>{
    try{const t=document.createElement("textarea");t.value=txt;t.style.position="fixed";t.style.opacity="0";document.body.appendChild(t);t.select();const r=document.execCommand("copy");t.remove();return r}catch(e){return false}
  };
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(txt).then(()=>toast(ok),()=>toast(fallback()?ok:"Kopyalanamadı. Yazdır düğmesini deneyin."));
  }else toast(fallback()?ok:"Kopyalanamadı. Yazdır düğmesini deneyin.");
}

/* ---------- Kaydetme işlemleri ---------- */
const val=id=>{const e=document.getElementById(id);return e?e.value.trim():""};
const checkedAl=()=>Array.prototype.map.call(document.querySelectorAll("#sheetBody [data-al]:checked"),x=>x.dataset.al);
function saveAct(id){
  const name=val("a_n");
  if(!name){toast("Etkinlik adını yazın");return}
  const o=sanitizeAct({id:id||0,n:name,cat:val("a_cat"),dur:val("a_dur"),place:val("a_place"),energy:val("a_energy"),e:val("a_e"),mat:val("a_mat"),how:val("a_how"),skill:val("a_skill"),caution:val("a_caution"),al:checkedAl()});
  if(id&&id<=100){P.edits[id]=o}
  else if(id){const i=P.custom.findIndex(x=>x.id===id);if(i>=0)P.custom[i]=o}
  else{o.id=Math.max.apply(null,[100].concat(P.custom.map(c=>c.id)))+1;P.custom.push(o);id=o.id}
  save();rebuild();render();openModal({type:"act",id:id});toast("Etkinlik kaydedildi");
}
function saveStu(id){
  const name=val("s_n");
  if(!name){toast("Öğrencinin adını yazın");return}
  const o=sanStudent({id:id||P.sid,n:name,b:val("s_b"),v:val("s_v"),t:val("s_t"),al:checkedAl(),ao:val("s_ao"),note:val("s_note")});
  if(id){const i=P.students.findIndex(x=>x.id===id);if(i>=0)P.students[i]=o}
  else{P.students.push(o);P.sid=o.id+1}
  P.students.sort((a,b)=>a.n.localeCompare(b.n,"tr"));
  save();closeModal();render();toast("Öğrenci kaydedildi");
}

/* ---------- Olaylar ---------- */
const armed={};
function twice(a,t,fn){
  if(!armed[a]){armed[a]=true;const old=t.textContent;t.textContent="Emin misiniz? Tekrar dokunun";setTimeout(()=>{armed[a]=false;if(t.isConnected)t.textContent=old},4000);return}
  armed[a]=false;fn();
}
document.addEventListener("click",e=>{
  if(e.target===$("#modal")){closeModal();return}
  const t=e.target.closest("[data-a]");if(!t)return;
  const a=t.dataset.a,d=t.dataset.date,id=Number(t.dataset.id);
  switch(a){
    case"tab":S.tab=t.dataset.t;render();window.scrollTo(0,0);break;
    case"settings":openModal({type:"settings"});break;
    case"close":closeModal();break;
    case"prevDay":S.date=iso(addDays(parse(S.date),-1));render();break;
    case"nextDay":S.date=iso(addDays(parse(S.date),1));render();break;
    case"today":S.date=todayISO();render();break;
    case"prevWeek":S.wk=iso(addDays(parse(S.wk),-7));render();break;
    case"nextWeek":S.wk=iso(addDays(parse(S.wk),7));render();break;
    case"thisWeek":S.wk=todayISO();render();break;
    case"prevMonth":S.mon={y:S.mon.m===0?S.mon.y-1:S.mon.y,m:(S.mon.m+11)%12};render();break;
    case"nextMonth":S.mon={y:S.mon.m===11?S.mon.y+1:S.mon.y,m:(S.mon.m+1)%12};render();break;
    case"thisMonth":{const n=new Date();S.mon={y:n.getFullYear(),m:n.getMonth()};render();break}
    case"openDay":openModal({type:"day",date:d});break;
    case"openAct":openModal({type:"act",id:id});break;
    case"goDate":closeModal();S.date=d;S.tab="bugun";render();window.scrollTo(0,0);break;
    case"cat":S.cat=t.dataset.c;drawList();break;
    case"print":{const x=getAct(id);if(x)printHtml(printHTML(x,d));break}
    case"copy":{const x=getAct(id);if(x)copyText(plainText(x,d));break}
    case"printWeek":printHtml(printWeekHTML(parse(d)));break;
    case"printMats":printHtml(printMatsHTML(parse(d)));break;
    case"printClass":printHtml(printClassHTML());break;
    case"printAllergy":printHtml(printAllergyHTML());break;
    case"done":{const i=P.done.indexOf(d);if(i>=0){P.done.splice(i,1);toast("İşaret kaldırıldı")}else{P.done.push(d);toast("Harika, etkinlik tamamlandı")}save();refreshAll();break}
    case"holiday":{const i=P.holidays.indexOf(d);if(i>=0){P.holidays.splice(i,1);toast("Tatil kaldırıldı")}else{P.holidays.push(d);toast("Tatil yapıldı; etkinlikler kaydı")}rebuild();save();refreshAll();break}
    case"swap":{const r=info(d);openModal({type:"swap",date:d,mode:r.k==="day"&&/Bahçe/.test(r.act.place)?"ic":"bahce"});break}
    case"swapMode":openModal({type:"swap",date:d,mode:t.dataset.mode});break;
    case"doSwap":{const other=swapAct(d,id);save();closeModal();render();toast(other?"Değişti. Önceki etkinlik "+fmtShort(other)+" gününe geçti.":"Etkinlik değişti.");break}
    case"newAct":openModal({type:"edit",id:0});break;
    case"editAct":openModal({type:"edit",id:id});break;
    case"saveAct":saveAct(id);break;
    case"delAct":twice(a,t,()=>{P.custom=P.custom.filter(c=>c.id!==id);for(const k in P.swap){if(P.swap[k]===id)delete P.swap[k]}save();rebuild();closeModal();render();toast("Etkinlik silindi")});break;
    case"resetAct":twice(a,t,()=>{delete P.edits[id];save();render();openModal({type:"act",id:id});toast("Varsayılana dönüldü")});break;
    case"newStu":openModal({type:"stu",id:0});break;
    case"editStu":openModal({type:"stu",id:id});break;
    case"saveStu":saveStu(id);break;
    case"delStu":twice(a,t,()=>{P.students=P.students.filter(s=>s.id!==id);save();closeModal();render();toast("Öğrenci silindi")});break;
    case"saveStart":{const v=$("#startInput").value;if(!DATE_RE.test(v)){toast("Geçerli bir tarih seçin");break}P.start=v;rebuild();save();toast("Başlangıç tarihi kaydedildi");refreshAll();break}
    case"clearHolidays":twice(a,t,()=>{P.holidays=[];rebuild();save();toast("Tatiller temizlendi");refreshAll()});break;
    case"resetDone":twice(a,t,()=>{P.done=[];save();toast("İlerleme sıfırlandı");refreshAll()});break;
    case"copyBackup":copyText(JSON.stringify(P),"Yedek kopyalandı");break;
    case"importBackup":twice(a,t,()=>{
      let j=null;try{j=JSON.parse($("#backupBox").value)}catch(err){}
      if(!j||typeof j!=="object"){toast("Yedek okunamadı. Kopyaladığınız yedeği yapıştırın.");return}
      P=loadFrom(j);rebuild();save();toast("Yedek yüklendi");refreshAll();
    });break;
  }
});
document.addEventListener("change",e=>{
  const t=e.target;
  if(t&&t.dataset&&t.dataset.a==="got"){const k=t.dataset.k;if(t.checked)P.got[k]=true;else delete P.got[k];save()}
});
document.addEventListener("input",e=>{
  const id=e.target.id;
  if(id==="q"){S.q=e.target.value;drawList()}
  else if(id==="clsName"){P.cls=e.target.value.slice(0,60);save()}
});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&!$("#modal").hidden)closeModal()});

/* ---------- Açılış ekranı ---------- */
(function(){
  const words=["Dilara","Öğretmenin","Etkinlikleri"],pal=["#FF6F61","#FFC933","#4FB3F0","#5DBB63","#B39BFF","#FF8FA3"];
  let i=0,h="";
  words.forEach((w,wi)=>{
    h+='<div class="line l'+(wi+1)+'">';
    for(const ch of w){h+='<div class="blk" style="--i:'+i+";--c:"+pal[i%pal.length]+";--r:"+(((i*37)%9)-4)+'deg">'+ch+"</div>";i++}
    h+="</div>";
  });
  $("#blocks").innerHTML=h;
  let entered=false;
  function enter(){
    if(entered)return;entered=true;
    rebuild();
    const hash=(location.hash||"").replace("#","");
    if(["bugun","hafta","ay","liste","sinif"].indexOf(hash)>=0)S.tab=hash;
    $("#app").hidden=false;render();
    const sp=$("#splash");sp.classList.add("out");
    setTimeout(()=>{sp.hidden=true;$("#view").focus({preventScroll:true})},520);
  }
  $("#splash").addEventListener("click",enter);
  $("#splash").addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();enter()}});
  const reduce=window.matchMedia&&window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  setTimeout(enter,reduce?2500:7500);
})();
})();

</script>
